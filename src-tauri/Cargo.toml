[package]
name = "xmap-studio"
version = "0.1.0"
description = "Companion desktop per XMind: equazioni LaTeX native ed editing avanzato"
edition = "2021"
rust-version = "1.77"
default-run = "xmap-studio"

[lib]
name = "xmap_studio_lib"
crate-type = ["rlib"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
async-channel = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
resvg = "0.45"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
flate2 = "1"
tar = "0.4"
pangocairo = "0.22"
cairo-rs = { version = "0.22", features = ["png"] }

[build-dependencies]
flate2 = "1"
tar = "0.4"
