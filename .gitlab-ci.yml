# Pipeline di release: gira SOLO quando si pusha un tag di versione (vX.Y.Z).
# Nessuna pipeline per branch o merge request.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# Produce due artefatti standalone (scaricabili dalla pipeline del tag):
#   - XMap-Studio-<versione>-portable-x64.exe   Windows, eseguibile portable
#   - XMap-Studio-<versione>-x86_64.AppImage    Linux, AppImage
# Il pacchetto Arch non si compila qui: vedi packaging/arch/README.md.

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - verify
  - build

variables:
  # Versione di pnpm con cui è stato generato pnpm-lock.yaml.
  PNPM_VERSION: '12.9.1'
  # Il binario di Electron serve solo agli script di sviluppo: electron-builder
  # scarica da sé quello della piattaforma di destinazione.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

# Immagine con Node, Wine (per icona e metadati dell'exe, cross-build da Linux)
# e le librerie di electron-builder. Il tag `wine` è quello con cui la build è
# stata provata (Node 24, Wine 11); se un aggiornamento dell'immagine rompe la
# build, fissa un tag o un digest preciso.
.release-base:
  image: electronuserland/builder:wine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install --global "pnpm@$PNPM_VERSION"
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

verify:
  extends: .release-base
  stage: verify
  script:
    - node scripts/check-release-version.mjs "$CI_COMMIT_TAG"
    - pnpm build
    - pnpm test

build:windows:
  extends: .release-base
  stage: build
  needs: [verify]
  script:
    - pnpm dist:win
    - cd apps/desktop/release && sha256sum XMap-Studio-*-portable-x64.exe > SHA256SUMS-windows.txt
  artifacts:
    name: xmap-studio-windows-$CI_COMMIT_TAG
    paths:
      - apps/desktop/release/XMap-Studio-*-portable-x64.exe
      - apps/desktop/release/SHA256SUMS-windows.txt
    expire_in: never

build:linux-appimage:
  extends: .release-base
  stage: build
  needs: [verify]
  script:
    - pnpm dist:linux
    - cd apps/desktop/release && sha256sum XMap-Studio-*-x86_64.AppImage > SHA256SUMS-linux.txt
  artifacts:
    name: xmap-studio-linux-$CI_COMMIT_TAG
    paths:
      - apps/desktop/release/XMap-Studio-*-x86_64.AppImage
      - apps/desktop/release/SHA256SUMS-linux.txt
    expire_in: never
