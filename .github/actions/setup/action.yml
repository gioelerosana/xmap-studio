# Passi comuni ai job di release: pnpm alla versione del lockfile, cache dello
# store e installazione delle dipendenze.
name: Setup pnpm
description: Installa pnpm e le dipendenze del workspace
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        npm install --global "pnpm@$PNPM_VERSION"
        pnpm config set store-dir "$GITHUB_WORKSPACE/.pnpm-store"
    - uses: actions/cache@v6
      with:
        path: .pnpm-store
        key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
