# Copia di sicurezza su GitLab: ogni push di branch o tag su GitHub viene
# replicato su gitlab.com/JoelShepard/xmap-studio, e così le cancellazioni.
# Lo sviluppo avviene solo su GitHub; su GitLab il `main` protetto accetta push
# soltanto dalla deploy key di questo workflow (secret GITLAB_MIRROR_SSH_KEY).
name: Mirror GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.event.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    # La cancellazione arriva sia come push (deleted) sia come delete: la
    # gestisce solo il secondo.
    if: github.event_name == 'delete' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Push su GitLab
        env:
          SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.ref }}
          REF_TYPE: ${{ github.event.ref_type }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/gitlab && chmod 600 ~/.ssh/gitlab
          # Chiave host di gitlab.com (ED25519, SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8).
          echo 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/gitlab -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          remote=git@gitlab.com:JoelShepard/xmap-studio.git
          if [ "$EVENT" = delete ]; then
            # Per l'evento delete `ref` è il nome corto del branch o del tag.
            prefix=refs/heads; [ "$REF_TYPE" = tag ] && prefix=refs/tags
            git init -q mirror && cd mirror
            git push "$remote" ":$prefix/$REF"
          else
            # Il ref locale, non lo SHA: i tag annotati restano annotati.
            git push --force "$remote" "$REF:$REF"
          fi
