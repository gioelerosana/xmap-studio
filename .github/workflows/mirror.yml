# Copia di sicurezza su GitLab: ogni push su `main` di GitHub viene replicato
# su gitlab.com/JoelShepard/xmap-studio. Gli altri branch e i tag restano solo
# su GitHub. Su GitLab il `main` protetto accetta push soltanto dalla deploy key
# di questo workflow (secret GITLAB_MIRROR_SSH_KEY).
name: Mirror GitLab

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push su GitLab
        env:
          SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/gitlab && chmod 600 ~/.ssh/gitlab
          # Chiave host di gitlab.com (ED25519, SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8).
          echo 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/gitlab -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git push --force git@gitlab.com:JoelShepard/xmap-studio.git main:main
