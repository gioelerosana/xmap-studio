# Workflow di release. Parte in tre modi:
#   - richiamato da release-manual.yml, lanciato a mano dall'utente, con il tag
#     appena creato (input `tag`): è il percorso normale;
#   - al push manuale di un tag di versione (vYY.MAJOR.MINOR, docs/RELEASE.md):
#       git tag -a v26.1.0 -m "v26.1.0" && git push origin v26.1.0
#   - a mano da GitHub (Actions › Release › Run workflow, su branch o tag).
#
# Nei lanci manuali su un branch non c'è un tag da confrontare: il controllo
# tag/versione si salta, build e test girano comunque.
#
# Produce due artefatti standalone, allegati alla GitHub Release del tag (nei
# lanci manuali restano scaricabili dalla pagina del run):
#   - XMap-Studio-<versione>-portable-x64.exe   Windows, eseguibile portable
#   - XMap-Studio-<versione>-x86_64.AppImage    Linux, AppImage
# Il pacchetto Arch non si compila qui: vedi packaging/arch/README.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag di versione da compilare e pubblicare (es. v26.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # Versione di pnpm con cui è stato generato pnpm-lock.yaml.
  PNPM_VERSION: '12.9.1'
  # Il binario di Electron serve solo agli script di sviluppo: electron-builder
  # scarica da sé quello della piattaforma di destinazione.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Tag da rilasciare: l'input quando il workflow è richiamato (lì `github` è il
  # contesto del chiamante, non il tag), altrimenti il tag pushato. Vuoto nei
  # lanci manuali su un branch.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Immagine con Node, Wine (per icona e metadati dell'exe, cross-build da
    # Linux) e le librerie di electron-builder. Il tag `wine` è quello con cui
    # la build è stata provata (Node 24, Wine 11); se un aggiornamento
    # dell'immagine rompe la build, fissa un tag o un digest preciso.
    container: electronuserland/builder:wine
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - name: Controllo tag/versione
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/check-release-version.mjs "$RELEASE_TAG"
          else
            echo "Lancio manuale senza tag: controllo tag/versione saltato."
          fi
      - run: pnpm build
      - run: pnpm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    container: electronuserland/builder:wine
    strategy:
      matrix:
        include:
          - target: windows
            script: dist:win
            pattern: XMap-Studio-*-portable-x64.exe
          - target: linux
            script: dist:linux
            pattern: XMap-Studio-*-x86_64.AppImage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.script }}
      - name: Checksum
        working-directory: apps/desktop/release
        run: sha256sum ${{ matrix.pattern }} > SHA256SUMS-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: xmap-studio-${{ matrix.target }}
          path: |
            apps/desktop/release/${{ matrix.pattern }}
            apps/desktop/release/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  release:
    if: inputs.tag || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "XMap Studio $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
