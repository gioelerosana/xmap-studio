# Workflow di release. Parte in tre modi:
#   - richiamato da release-manual.yml, lanciato a mano dall'utente, con il tag
#     appena creato (input `tag`): è il percorso normale;
#   - al push manuale di un tag di versione (vYY.MAJOR.MINOR, docs/RELEASE.md):
#       git tag -a v26.1.0 -m "v26.1.0" && git push origin v26.1.0
#   - a mano da GitHub (Actions › Release › Run workflow, su branch o tag).
#
# Nei lanci manuali su un branch non c'è un tag da confrontare: il controllo
# tag/versione si salta, build e test girano comunque.
#
# Produce tre artefatti, allegati alla GitHub Release del tag (nei lanci
# manuali restano scaricabili dalla pagina del run):
#   - XMap-Studio-<versione>-portable-x64.exe   Windows, eseguibile portable
#   - XMap-Studio-<versione>-x86_64.AppImage    Linux, AppImage, con il suo
#     `.zsync` per l'aggiornamento differenziale (apps/desktop/scripts/appimage-zsync.mjs)
#   - xmap-studio-<versione>-linux-x86_64.tar.gz   Arch Linux, app precompilata
#     senza Electron (packaging/arch/build-tarball.sh)
# Dopo la Release, il job `aur` pubblica xmap-studio-bin su AUR, che scarica
# quel tarball (packaging/arch/README.md). Serve il secret AUR_SSH_PRIVATE_KEY:
# senza, il job lo segnala e non pubblica.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag di versione da compilare e pubblicare (es. v26.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # Versione di pnpm con cui è stato generato pnpm-lock.yaml.
  PNPM_VERSION: '12.16.1'
  # Il binario di Electron serve solo agli script di sviluppo: electron-builder
  # scarica da sé quello della piattaforma di destinazione.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Tag da rilasciare: l'input quando il workflow è richiamato (lì `github` è il
  # contesto del chiamante, non il tag), altrimenti il tag pushato. Vuoto nei
  # lanci manuali su un branch.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Immagine con Node, Wine (per icona e metadati dell'exe, cross-build da
    # Linux) e le librerie di electron-builder. Il tag `wine` è quello con cui
    # la build è stata provata (Node 24, Wine 11); se un aggiornamento
    # dell'immagine rompe la build, fissa un tag o un digest preciso.
    container: electronuserland/builder:wine
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - name: Controllo tag/versione
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/check-release-version.mjs "$RELEASE_TAG"
          else
            echo "Lancio manuale senza tag: controllo tag/versione saltato."
          fi
      - run: pnpm build
      - run: pnpm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    container: electronuserland/builder:wine
    strategy:
      matrix:
        include:
          - target: windows
            script: dist:win
            pattern: XMap-Studio-*-portable-x64.exe
            extra: ''
          - target: linux
            script: dist:linux
            pattern: XMap-Studio-*-x86_64.AppImage
            extra: XMap-Studio-*-x86_64.AppImage.zsync
          - target: arch
            script: dist:arch
            pattern: xmap-studio-*-linux-x86_64.tar.gz
            extra: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.script }}
      # Update information nell'AppImage e file .zsync: va fatto prima del
      # checksum, perché modifica l'AppImage.
      - name: zsync (AppImage)
        if: matrix.target == 'linux'
        working-directory: apps/desktop/release
        run: |
          apt-get update -qq && apt-get install -y -qq zsync
          for file in ${{ matrix.pattern }}; do
            node ../scripts/appimage-zsync.mjs "$file" "$GITHUB_REPOSITORY"
          done
      - name: Checksum
        working-directory: apps/desktop/release
        run: sha256sum ${{ matrix.pattern }} > SHA256SUMS-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: xmap-studio-${{ matrix.target }}
          path: |
            apps/desktop/release/${{ matrix.pattern }}
            ${{ matrix.extra && format('apps/desktop/release/{0}', matrix.extra) || '' }}
            apps/desktop/release/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  release:
    if: inputs.tag || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "XMap Studio $RELEASE_TAG" \
            --generate-notes \
            --verify-tag

  # Pubblica su AUR il PKGBUILD di packaging/arch/aur/ con i checksum del
  # tarball appena allegato alla Release (lo riscarica dall'URL pubblico, lo
  # stesso che userà l'utente). Gira in un container Arch per makepkg.
  aur:
    if: inputs.tag || github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Pubblicazione su AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Chiave host di aur.archlinux.org, fingerprint
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 (pubblicata su
          # https://aur.archlinux.org/).
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::Secret AUR_SSH_PRIVATE_KEY assente: AUR non aggiornato. Pubblica a mano con packaging/arch/aur-publish.sh."
            exit 0
          fi
          pacman -Syu --noconfirm --needed git openssh
          # makepkg non gira da root.
          useradd -m builder
          home=/home/builder
          install -d -m 700 -o builder -g builder "$home/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$home/.ssh/aur"
          printf '%s\n' "$AUR_HOST_KEY" > "$home/.ssh/known_hosts"
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > "$home/.ssh/config"
          chmod 600 "$home/.ssh/aur" "$home/.ssh/config"
          chown -R builder:builder "$home/.ssh"
          su builder -c "git config --global user.name 'github-actions[bot]' && git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'"
          su builder -c "bash '$GITHUB_WORKSPACE/packaging/arch/aur-publish.sh'"
