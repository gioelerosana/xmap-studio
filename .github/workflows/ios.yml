# Verifica dell'app iOS (apps/ios) su un runner macOS: in locale manca l'SDK iOS.
# 1. compila il pacchetto Swift per iOS come lo compila xtool;
# 2. impacchetta un'app per il simulatore (progetto Xcode generato al volo con
#    XcodeGen, non versionato), la installa e le fa aprire un .xmind, a freddo e a
#    caldo; gli screenshot finiscono tra gli artifact del run.
name: iOS

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/web/src/app/incomingFiles.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: '12.16.1'
  BUNDLE_ID: com.gioelerosana.xmapstudio

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Versioni
        run: xcodebuild -version && swift --version

      - name: Info.plist valido
        run: plutil -lint apps/ios/Info.plist

      - name: Compila il pacchetto Swift per iOS
        working-directory: apps/ios
        run: |
          xcodebuild build -scheme XMapStudio -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/spm" CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit "${PIPESTATUS[0]}"

      - uses: ./.github/actions/setup
      - name: Build web nel bundle
        run: apps/ios/scripts/prepare-web.sh

      - name: Genera il progetto Xcode dell'app
        working-directory: apps/ios
        run: |
          brew install xcodegen
          cat > project.yml <<'YAML'
          name: XMapStudioCI
          options:
            deploymentTarget:
              iOS: '17.0'
          targets:
            XMapStudio:
              type: application
              platform: iOS
              sources:
                - path: Sources/XMapStudio
                - path: web
                  type: folder
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  PRODUCT_NAME: XMapStudio
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  SWIFT_VERSION: '5'
                  TARGETED_DEVICE_FAMILY: '1,2'
          YAML
          xcodegen generate

      - name: Compila l'app per il simulatore
        working-directory: apps/ios
        run: |
          xcodebuild build -project XMapStudioCI.xcodeproj -scheme XMapStudio \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/app" CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit "${PIPESTATUS[0]}"

      - name: Apre un .xmind nel simulatore
        run: |
          set -x
          app="$RUNNER_TEMP/app/Build/Products/Debug-iphonesimulator/XMapStudio.app"
          plutil -p "$app/Info.plist" | grep -A3 -E 'CFBundleDocumentTypes|UTImportedTypeDeclarations'
          shots="$RUNNER_TEMP/shots"; mkdir -p "$shots"
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"

          # Due file fuori dalla sandbox dell'app, come quelli di «Apri in».
          inbox="$RUNNER_TEMP/inbox"; mkdir -p "$inbox"
          cp "demo/Relazioni.xmap-studio.xmind" "$inbox/Freddo.xmind"
          cp "demo/Verifica-v1.xmap-studio.xmind" "$inbox/Caldo.xmind"

          # A freddo: l'app è chiusa e la apre il file.
          xcrun simctl openurl "$udid" "file://$inbox/Freddo.xmind"
          sleep 12
          xcrun simctl io "$udid" screenshot "$shots/1-freddo.png"
          # A caldo: l'app è già aperta sulla prima mappa.
          xcrun simctl openurl "$udid" "file://$inbox/Caldo.xmind"
          sleep 8
          xcrun simctl io "$udid" screenshot "$shots/2-caldo.png"
          # Riferimento: avvio normale, senza file.
          xcrun simctl terminate "$udid" "$BUNDLE_ID" || true
          xcrun simctl launch "$udid" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$udid" screenshot "$shots/0-avvio.png"

          xcrun simctl spawn "$udid" log show --last 5m --style compact \
            --predicate 'process == "XMapStudio"' > "$shots/log.txt" || true
          tail -n 60 "$shots/log.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulatore
          path: ${{ runner.temp }}/shots
