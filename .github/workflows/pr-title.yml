# Controllo dei PR verso main: il titolo deve essere in Conventional Commits.
# Il merge non produce nessuna release (la lancia a mano l'utente, vedi
# release-manual.yml e docs/RELEASE.md), ma il titolo — che con lo squash merge
# diventa il subject del commit su main — è ciò che il calcolo automatico
# della release leggerà.
name: Titolo PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test scripts/release-version.test.mjs
      - name: Controllo del titolo
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kind=$(node scripts/release-version.mjs check-title --title "$TITLE")
          {
            echo "Titolo riconosciuto: \`$TITLE\`"
            echo
            echo "- tipo → peso in una release: $kind"
            echo "- **Il merge non rilascia nulla**: la release si lancia a mano (docs/RELEASE.md)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
