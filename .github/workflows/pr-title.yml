# Controllo dei PR verso main: il titolo deve essere in Conventional Commits,
# perché al merge decide la release (auto-release.yml, docs/RELEASE.md). Il
# riepilogo del job mostra la versione che il merge produrrebbe oggi.
name: Titolo PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test scripts/
      - name: Release prevista al merge
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump=$(node scripts/release-version.mjs bump --title "$TITLE" --labels "$LABELS")
          if [ "$bump" = none ]; then
            echo "Al merge: nessuna release." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            version=$(node scripts/release-version.mjs next --bump "$bump")
            echo "Al merge: release $bump, v$version (se nel frattempo non ne escono altre)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
