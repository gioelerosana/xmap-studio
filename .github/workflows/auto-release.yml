# Release automatica: quando un PR viene unito in main, il suo titolo
# (Conventional Commits) o l'etichetta `release:*` decidono se e quale versione
# pubblicare (regole in docs/RELEASE.md §Versioning):
#   feat / tipo con «!»                       → vYY.(MAJOR+1).0
#   fix, perf, refactor, style, revert, build → vYY.MAJOR.(MINOR+1)
#   docs, ci, chore, test                     → nessuna release
# Il job allinea le versioni (package.json, PKGBUILD) con un commit
# `chore(release): vX` su main, crea il tag e richiama release.yml e il mirror:
# i push fatti con GITHUB_TOKEN non avviano da soli altri workflow.
name: Auto release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

# Un merge alla volta: due release in parallelo calcolerebbero lo stesso tag.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Calcolo della versione
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          bump=$(node scripts/release-version.mjs bump --title "$TITLE" --labels "$LABELS")
          if [ "$bump" = none ]; then
            echo "PR senza release ($TITLE)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node scripts/release-version.mjs next --bump "$bump" --date "$MERGED_AT")
          echo "Release $bump: v$version" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit di release e tag
        if: steps.version.outputs.tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/release-version.mjs set "$VERSION"
          node scripts/check-release-version.mjs "$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $TAG" -m "Release automatica dopo il merge di #$PR_NUMBER."
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  mirror:
    needs: tag
    if: needs.tag.outputs.tag
    uses: ./.github/workflows/mirror.yml
    secrets: inherit
