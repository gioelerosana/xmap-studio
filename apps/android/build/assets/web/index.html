<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: il contenuto arriva sotto notch e home indicator, gestiti con
         env(safe-area-inset-*). Lo zoom della pagina è disattivato: pinch e doppio tap
         sono gesti della mappa. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": la pagina parte sotto la status bar di iOS/iPadOS. Con "black-translucent"
         il contenuto sta sotto la barra e iPadOS vi applica un effetto di sfocatura che copre l'header. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="XMap Studio" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-256.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>XMap Studio</title>
    <!-- Se l'app non parte (schermo bianco) mostra l'errore a video: su iPad/iPhone non c'è console. -->
    <script>
      (function () {
        function show(message) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount) return;
          var box = document.createElement('pre');
          box.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:16px;font:13px/1.4 monospace;color:#b00020';
          box.textContent = 'XMap Studio non è partito:\n' + message;
          root.appendChild(box);
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'errore') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CrkTOmUo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-iDnN5D56.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
